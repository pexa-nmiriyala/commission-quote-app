# Dev profile overrides

# commission.api.url is NOT used in dev — MockCommissionApiAdapter is injected
# directly via @Profile("dev"); no HTTP call is made to any external service.
commission:
  api:
    url: http://localhost:8080/mock-unused

# In dev, Keycloak runs on localhost:9090 (mapped from container port 8080).
# Override the issuer URI so Spring Boot can fetch JWKS from the local instance.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/commission-app}
