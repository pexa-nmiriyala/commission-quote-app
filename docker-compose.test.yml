services:

  # ── Run frontend (Vitest) tests inside Docker ──────────────────────────────
  # Server tests run on the host via: make server-test (./gradlew test)
  # They cannot run inside Docker because the Gradle wrapper needs to download
  # its distribution, which fails in network-restricted environments.
  client-test:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --ignore-scripts && npx vitest run"]
    volumes:
      - ./client:/app
      - /app/node_modules
